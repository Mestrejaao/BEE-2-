/* Layout: one-screen app. Brand header, segmented tabs (Texto / Voz). In Texto, a function workspace opens above the composer when a command is sent. */
:root {
  --bg: #F6F5EF;
  --surface: #FFFFFF;
  --fg: #17150E;
  --muted: #6B6757;
  --line: #E3E0D3;
  --accent: #FDBE0F;
  --accent-ink: #17150E;
  --user-bg: #17150E;
  --user-fg: #FFFFFF;
  --code-bg: #17150E;
  --code-fg: #F6E7B0;
  --code-muted: #8A8466;
  --stage-bg: #090C12;
  --stage-fg: #EAF6FF;
  --stage-muted: #8FA6B8;
  --sky: #8FDBFF;
  --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #100F0A; --surface: #1B1A13; --fg: #F4F1E4; --muted: #A29D88; --line: #2E2C20;
    --user-bg: #FDBE0F; --user-fg: #17150E; --code-bg: #0A0A06; --code-fg: #F6E7B0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #100F0A; --surface: #1B1A13; --fg: #F4F1E4; --muted: #A29D88; --line: #2E2C20;
  --user-bg: #FDBE0F; --user-fg: #17150E; --code-bg: #0A0A06; --code-fg: #F6E7B0;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }

.app {
  height: 100%;
  max-width: 720px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding-block: 12px;
}

/* Header */
.top { display: flex; align-items: center; gap: 12px; }
.logo { width: 46px; height: 46px; border-radius: 13px; display: block; flex: none; }
.top h1 { margin: 0; font: 800 26px/1 var(--display); letter-spacing: 0.02em; }
.top p { margin: 3px 0 0; font: 500 11px/1 var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }

/* Tabs */
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.tab { border: 0; background: transparent; padding: 10px 12px; border-radius: 10px; font-weight: 600; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.tab svg { width: 18px; height: 18px; }

/* Panels */
.panel { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
.panel[hidden] { display: none; }

/* Chat */
.msgs { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; padding: 12px 8px 6px; }
.panel.has-work .msgs { flex: 1 1 30%; }
.note { align-self: center; font: 500 11px/1.3 var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; text-align: center; }
.msg { max-width: min(86%, 560px); position: relative; min-width: 0; }
.msg .bubble { padding: 11px 14px; border-radius: 18px; overflow-wrap: anywhere; white-space: pre-wrap; }
.msg.user { align-self: flex-end; }
.msg.user .bubble { background: var(--user-bg); color: var(--user-fg); border-bottom-right-radius: 6px; }
.msg.bee { align-self: flex-start; }

.msg.bee .bubble .typing i { background: #8E6A00; }
/* Yellow dot at the top-left corner of every BEE message */
.msg.bee::before { content: ""; position: absolute; top: -6px; left: -6px; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px var(--bg); z-index: 1; }
.typing { display: inline-flex; gap: 5px; padding: 4px 0; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1s ease-in-out infinite; }
.typing i:nth-child(2) { animation-delay: 0.15s; }
.typing i:nth-child(3) { animation-delay: 0.3s; }
@keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
@keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: 0.5; } }

/* Function workspace (opens on command) */
.work { flex: 1 1 62%; min-height: 0; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.work[hidden] { display: none; }
.work-head { display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 14px; border-bottom: 1px solid var(--line); }
.work-head strong { font: 700 15px/1 var(--display); }
.work-head span { flex: 1; min-width: 0; font: 500 11px/1.2 var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.xbtn { width: 32px; height: 32px; flex: none; border: 0; border-radius: 50%; background: transparent; color: var(--muted); display: grid; place-items: center; cursor: pointer; }
.xbtn:hover { background: var(--bg); color: var(--fg); }
.xbtn svg { width: 18px; height: 18px; }
.work-body { flex: 1; min-height: 0; overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.btn { border: 0; border-radius: 999px; padding: 8px 14px; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 13px; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--code-fg); border: 1px solid var(--code-muted); padding: 4px 10px; font-size: 12px; }
.hint { margin: 0; font: 500 11px/1.4 var(--mono); color: var(--muted); }

.code { background: var(--code-bg); color: var(--code-fg); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
.codebar { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px 8px 14px; border-bottom: 1px solid #2a2820; font: 500 12px/1 var(--mono); color: var(--code-muted); }
.codeview { margin: 0; padding: 10px 14px; font: 500 13px/1.6 var(--mono); overflow: auto; counter-reset: ln; white-space: pre; }
.codeview .ln { display: block; min-height: 1.6em; counter-increment: ln; }
.codeview .ln::before { content: counter(ln); display: inline-block; width: 2ch; margin-right: 14px; text-align: right; color: var(--code-muted); }

.edit label { display: block; margin-bottom: 4px; font: 500 11px/1 var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
.edit textarea { width: 100%; resize: vertical; min-height: 84px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); }
.edrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin: 10px 0; }
.tag { font: 500 12px/1.2 var(--mono); color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.edout { padding: 10px 12px; border-left: 4px solid var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); border-radius: 4px 12px 12px 4px; min-height: 48px; white-space: pre-wrap; overflow-wrap: anywhere; }
.edit .hint { margin-top: 10px; }

.screen { position: relative; aspect-ratio: 16 / 9; max-height: 100%; border-radius: 14px; overflow: hidden; background: var(--stage-bg); display: flex; align-items: flex-end; justify-content: center; gap: 5px; padding: 0 18% 14% ; box-shadow: inset 0 0 60px rgba(143, 219, 255, 0.18); }
.screen .eq { display: flex; align-items: flex-end; gap: 5px; width: 100%; height: 62%; }
.screen .eq i { flex: 1; min-width: 0; border-radius: 4px 4px 0 0; background: linear-gradient(#FFE27A, #FDBE0F); animation: eq var(--d, 1s) ease-in-out infinite; animation-delay: var(--l, 0s); }
.player.paused .eq i { animation-play-state: paused; }
@keyframes eq { 0%, 100% { height: 14%; } 50% { height: 100%; } }
.livepill { position: absolute; top: 10px; left: 10px; display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 999px; background: rgba(0, 0, 0, 0.55); color: #fff; font: 500 11px/1 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; }
.livepill i { width: 8px; height: 8px; border-radius: 50%; background: #E5484D; animation: pulse 1.2s ease-in-out infinite; }
.player.paused .livepill i { animation: none; background: var(--stage-muted); }
.pbar { display: flex; align-items: center; gap: 10px; }
.pbar button { width: 38px; height: 38px; flex: none; border: 0; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; cursor: pointer; }
.pbar button svg { width: 18px; height: 18px; }
.pbar .pt { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pbar .tm { font: 500 12px/1 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }

/* Composer */
.composer { display: flex; gap: 8px; align-items: center; padding: 6px 6px 6px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; }
.composer input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 10px 0; outline: none; }
.composer:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }
.composer input::placeholder { color: var(--muted); }
.send { width: 44px; height: 44px; flex: none; border: 0; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; cursor: pointer; }
.send:disabled { opacity: 0.5; cursor: default; }
.send svg { width: 20px; height: 20px; }

/* Voice */
.stage { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; border-radius: 22px; background: var(--stage-bg); color: var(--stage-fg); }
.stage canvas { flex: 1 1 0; min-height: 0; width: 100%; height: 0; display: block; }
.caption { flex: none; padding: 8px 18px 18px; text-align: center; }
.caption strong { display: block; font: 700 18px/1.2 var(--display); }
.caption span { display: block; margin-top: 6px; font: 500 12px/1.4 var(--mono); color: var(--stage-muted); letter-spacing: 0.04em; min-height: 1.4em; }
.voicebar { display: flex; justify-content: center; padding-bottom: 4px; }
.mic { position: relative; width: 68px; height: 68px; border: 0; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; cursor: pointer; }
.mic svg { width: 28px; height: 28px; }
.mic[aria-pressed="true"]::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid var(--sky); animation: ring 1.6s ease-out infinite; }
@keyframes ring { from { transform: scale(0.9); opacity: 0.9; } to { transform: scale(1.3); opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  .livepill i, .typing i, .mic[aria-pressed="true"]::after, .screen .eq i { animation: none; }
  .screen .eq i { height: 55%; }
}


/* BEE / VISUAL REFRESH — premium dark workspace */
:root {
  color-scheme: dark;

  --surface: #101722;
  --fg: #F4F6FA;

  --user-fg: #171306;
  --code-bg: #080D15;
  --code-fg: #F8E9B4;
  --code-muted: #8E9AAC;
  --stage-bg: #080D15;
  --stage-fg: #F4F6FA;
  --stage-muted: #8E9AAC;
  --sky: #79D9F5;

.work-body { padding:16px; }
.btn { background:linear-gradient(135deg,#FFDA61,#F4B914); box-shadow:0 7px 20px rgba(255,201,40,.12); }
.edit textarea { color:var(--fg); background:#0A111C; border-color:var(--line); }
.edout { background:rgba(255,201,40,.08); }
.code { border:1px solid rgba(255,255,255,.08); }
.composer {
  padding:7px 7px 7px 19px; min-height:66px; gap:12px;
  background:rgba(17,25,38,.96); border:1px solid rgba(150,170,198,.22);
  border-radius:20px; box-shadow:0 16px 45px rgba(0,0,0,.28);
  transition:border-color .2s ease,box-shadow .2s ease;
}
.composer:focus-within {
  border-color:rgba(255,201,40,.72);
  box-shadow:0 0 0 4px rgba(255,201,40,.09),0 16px 45px rgba(0,0,0,.28);
}
.composer input { color:#F4F6FA; padding:12px 0; font-size:15px; }
.composer input::placeholder { color:#748197; }
.send {
  width:50px; height:50px; border-radius:15px;
  background:linear-gradient(135deg,#FFDA61,#F4B914);
  box-shadow:0 6px 18px rgba(255,201,40,.18);
  transition:transform .18s ease,filter .18s ease;
}
.send:hover { transform:translateY(-1px); filter:brightness(1.06); }
.stage {
  border:1px solid rgba(132,162,194,.16); border-radius:24px;
  background:
    radial-gradient(circle at 50% 42%,rgba(35,92,123,.18),transparent 42%),
    linear-gradient(145deg,#101B2A,#080D15 72%);
  box-shadow:inset 0 1px rgba(255,255,255,.035),0 22px 60px rgba(0,0,0,.28);
}
.caption strong { color:#F8F9FC; font-size:20px; }
.caption span { color:#8E9AAC; }
.mic {
  width:72px; height:72px; border-radius:22px;
  background:linear-gradient(135deg,#FFDA61,#F4B914);
  box-shadow:0 9px 28px rgba(255,201,40,.2);
}
:focus-visible { outline:3px solid #79D9F5; outline-offset:3px; }
button { -webkit-tap-highlight-color:transparent; }
@media (min-width:760px) {
  .app { padding-block:30px 26px; gap:20px; }
  .top { padding-bottom:22px; }
  .panel { min-height:0; }
  .msgs { padding-inline:24px; }
}
@media (max-width:600px) {
  body { padding-inline:max(14px,env(safe-area-inset-left,0px)); }
  .app { min-height:100dvh; padding-block:16px max(14px,env(safe-area-inset-bottom,0px)); gap:14px; }
  .top { padding-bottom:15px; }
  .logo { width:44px; height:44px; border-radius:14px; }
  .top h1 { font-size:25px; }
  .tabs { width:100%; }
  .tab { min-height:42px; }
  .msgs { padding:18px 2px 12px; gap:16px; }
  .msg { max-width:90%; }
  .msg .bubble { padding:12px 14px; font-size:14px; }
  .composer { min-height:60px; padding-left:15px; border-radius:18px; }
  .send { width:44px; height:44px; border-radius:14px; }
  .work { border-radius:17px; }
  .stage { border-radius:19px; }
}
@media (prefers-reduced-motion: reduce) {
  *,*::before,*::after { scroll-behavior:auto !important; transition:none !important; }
}

</style>

  function setPhase(p) {
    phase = p;
    if (p === "idle") { capTitle.textContent = "Toque para conversar com a BEE"; capSub.textContent = "Demonstração visual da voz"; }
    if (p === "listening") { capTitle.textContent = "Ouvindo…"; capSub.textContent = "Fale com a BEE"; }
    if (p === "speaking") { capTitle.textContent = "BEE está falando"; capSub.textContent = LINES[lineIdx++ % LINES.length]; }
  }
  function cycle() {
    if (!session) return;
    setPhase("listening");
    timer = setTimeout(function () {
      if (!session) return;
      setPhase("speaking");
      timer = setTimeout(cycle, 5200);
    }, 2600);
  }
  function startSession() {
    session = true;
    mic.setAttribute("aria-pressed", "true");
    mic.setAttribute("aria-label", "Encerrar conversa por voz");
    document.getElementById("micIcon").innerHTML = '<rect x="6" y="6" width="12" height="12" rx="2.5" fill="currentColor"/>';
    cycle();
  }
  function endSession() {
    session = false; clearTimeout(timer);
    mic.setAttribute("aria-pressed", "false");
    mic.setAttribute("aria-label", "Iniciar conversa por voz");
    document.getElementById("micIcon").innerHTML = '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>';
    setPhase("idle");
  }
  mic.addEventListener("click", function () { session ? endSession() : startSession(); });

  showTab(location.hash.replace("#", ""));
})();

</script>
</body></html>
