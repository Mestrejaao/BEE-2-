name: BEE backend checks

on:
  push:
    branches:
      - feature/bee-ai-backend
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate and commit dependency lockfile
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): add npm lockfile"
          git push
      - name: Verify clean reproducible install
        run: |
          rm -rf node_modules
          npm ci --ignore-scripts --no-audit --no-fund
          npm ls @upstash/ratelimit @upstash/redis --depth=0
      - name: Validate Wrangler configuration
        run: node -e "JSON.parse(require('node:fs').readFileSync('wrangler.jsonc', 'utf8'))"
      - name: Run automated tests
        run: npm test
