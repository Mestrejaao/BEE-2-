<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090b10">
  <title>BEE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">

    <header class="header">
      <div class="logo">B</div>
      <div>
        <h1>BEE</h1>
        <p>Seu assistente pessoal de IA</p>
      </div>
    </header>

    <nav class="mode-selector">
      <button type="button" id="mode-text" class="active">
        Texto
      </button>

      <button type="button" id="mode-voice">
        Voz
      </button>
    </nav>

    <section id="text-view" class="view">
      <section class="welcome">
        <h2>Olá! Eu sou a BEE.</h2>
        <p>Como posso ajudar você hoje?</p>
      </section>

      <section class="chat" id="chat">
        <div class="message assistant">
          Olá! Sou a BEE. Estou sendo preparada para conversar com você.
        </div>
      </section>

      <form id="chat-form">
        <input
          id="message-input"
          type="text"
          placeholder="Digite uma mensagem..."
          autocomplete="off"
        >
        <button type="submit">Enviar</button>
      </form>
    </section>

    <section id="voice-view" class="view hidden">
      <div class="voice-container">
        <div class="orb" id="voice-orb"></div>
        <h2>Modo Voz</h2>
        <p>A conversa por voz está sendo preparada.</p>
      </div>
    </section>

    <footer>BEE · Seu assistente pessoal</footer>

  </main>

  <script src="app.js"></script>
</body>
</html>
